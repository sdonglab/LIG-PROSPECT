# Saved-model inference. Use with ligprospect-predict.
# Change only prediction.* and data.* when predicting a new dataset.
prediction:
  workflow: single_run_random_split  # or hold_out_mutant
  descriptor: dd                     # dd, add, pca_cc, or umap_ic
  holdout_mutant: A36E               # used only by hold_out_mutant

model:
  root: saved_models

data:
  # Bundled DD example. Replace with your own feature-file directory.
  features_dir: example_data/desc-4
  file_glob: "*.txt"
  dataset_name: example_data_desc-4

output:
  root: outputs/prediction
  filename_suffix: predictions
  pad_value: 0.0
