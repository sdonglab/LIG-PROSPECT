[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lig-prospect"
version = "0.1.0"
description = "A Machine Learning Pipeline for Predicting Flavoprotein Spectra from Structural Descriptors (PCA-CC, UMAP-IC, DD, ADD)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "joblib",
  "scikit-learn",
  "pyyaml",
  "matplotlib",
  "scipy",
  "umap-learn; platform_system != 'Windows' or python_version >= '3.9'",
]

[project.optional-dependencies]
notebook = ["jupyterlab"]

[project.scripts]
ligprospect-evaluate-bootstrap = "lig_prospect.bootstrap_cli:main"
ligprospect-train-single-split = "lig_prospect.single_cli:main"
ligprospect-evaluate-heldout-mutant = "lig_prospect.mutant_cli:main"
ligprospect-compare-models = "lig_prospect.compare_baselines_cli:main"
ligprospect-predict = "lig_prospect.predict_cli:main"
